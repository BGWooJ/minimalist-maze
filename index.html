<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Minimalist Maze: Glow & Physics</title>
<style>
  body { margin: 0; background: #0E0F12; color: #fff; font-family: sans-serif; }
  #hud { position: fixed; top: 10px; left: 10px; display: flex; gap: 8px; }
  .btn { background:#1A1A1A; color:#fff; border:none; padding:6px 10px; border-radius:6px; cursor:pointer; }
  .btn:hover { background:#242424; }
  canvas { display:block; width:100vw; height:100vh; }
</style>
</head>
<body>
<div id="hud">
  <span id="levelLabel">Level 1</span>
  <button class="btn" id="btnNext">Next</button>
  <button class="btn" id="btnRestart">Restart</button>
</div>
<canvas id="canvas"></canvas>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let level = 1;
let seed = Math.floor(Math.random()*1e9);
let maze, ball, goal, particles = [];
let dragging = false, dragTarget = {x:0,y:0};

const cellSize = 40;
const cols = 15, rows = 15;
const offsetX = 100, offsetY = 100;

// Maze generation (Recursive Backtracker)
function generateMaze(seed) {
  const rng = mulberry32(seed);
  const grid = Array.from({length:rows},(_,y)=>
    Array.from({length:cols},(_,x)=>({x,y,walls:{N:true,S:true,E:true,W:true}}))
  );
  const stack = [];
  let current = grid[0][0];
  const visited = new Set([key(current)]);
  function key(c){return c.x+","+c.y;}
  function neighbors(c){
    const dirs=[['N',0,-1,'S'],['S',0,1,'N'],['E',1,0,'W'],['W',-1,0,'E']];
    const ns=[];
    for(const [d,dx,dy,opp] of dirs){
      const nx=c.x+dx,ny=c.y+dy;
      if(nx>=0&&nx<cols&&ny>=0&&ny<rows&&!visited.has(nx+","+ny))
        ns.push({dir:d,opp,cell:grid[ny][nx]});
    }
    return ns;
  }
  while(true){
    const ns=neighbors(current);
    if(ns.length){
      stack.push(current);
      const pick=ns[Math.floor(rng()*ns.length)];
      current.walls[pick.dir]=false;
      pick.cell.walls[pick.opp]=false;
      current=pick.cell;
      visited.add(key(current));
    } else if(stack.length) current=stack.pop();
    else break;
  }
  return grid;
}

// RNG
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t^=t+Math.imul(t^t>>>7,61|t);return((t^t>>>14)>>>0)/4294967296;}}

// Setup level
function setupLevel(){
  maze=generateMaze(seed);
  ball={x:offsetX+cellSize/2,y:offsetY+cellSize/2,r:14,vx:0,vy:0};
  goal={x:offsetX+(cols-1)*cellSize+cellSize/2,y:offsetY+(rows-1)*cellSize+cellSize/2,r:16};
  particles=[];
  document.getElementById('levelLabel').textContent=`Level ${level}`;
}

// Input
canvas.addEventListener('pointerdown',e=>{
  dragging=true;
  const rect=canvas.getBoundingClientRect();
  dragTarget={x:e.clientX-rect.left,y:e.clientY-rect.top};
});
canvas.addEventListener('pointermove',e=>{
  if(dragging){
    const rect=canvas.getBoundingClientRect();
    dragTarget={x:e.clientX-rect.left,y:e.clientY-rect.top};
  }
});
canvas.addEventListener('pointerup',()=>dragging=false);
canvas.addEventListener('pointerleave',()=>dragging=false);

// Buttons
document.getElementById('btnNext').onclick=()=>{
  level++; seed=Math.floor(Math.random()*1e9); setupLevel();
};
document.getElementById('btnRestart').onclick=()=>setupLevel();

// Physics update
function update(dt){
  if(dragging){
    const dx=dragTarget.x-ball.x,dy=dragTarget.y-ball.y;
    const dist=Math.hypot(dx,dy);
    if(dist>1){
      const ax=dx/dist*1200*dt,ay=dy/dist*1200*dt;
      ball.vx+=ax; ball.vy+=ay;
      const speed=Math.hypot(ball.vx,ball.vy);
      if(speed>400){ball.vx*=400/speed;ball.vy*=400/speed;}
    }
  }
  ball.x+=ball.vx*dt; ball.y+=ball.vy*dt;
  ball.vx*=0.99; ball.vy*=0.99;

  // Collisions with walls
  for(let y=0;y<rows;y++){
    for(let x=0;x<cols;x++){
      const c=maze[y][x];
      const bx=offsetX+x*cellSize,by=offsetY+y*cellSize;
      if(c.walls.N && ball.y-ball.r<by && ball.x>bx && ball.x<bx+cellSize){ball.y=by+ball.r;ball.vy*=-0.5;}
      if(c.walls.S && ball.y+ball.r>by+cellSize && ball.x>bx && ball.x<bx+cellSize){ball.y=by+cellSize-ball.r;ball.vy*=-0.5;}
      if(c.walls.W && ball.x-ball.r<bx && ball.y>by && ball.y<by+cellSize){ball.x=bx+ball.r;ball.vx*=-0.5;}
      if(c.walls.E && ball.x+ball.r>bx+cellSize && ball.y>by && ball.y<by+cellSize){ball.x=bx+cellSize-ball.r;ball.vx*=-0.5;}
    }
  }

  // Goal check
  const dx=ball.x-goal.x,dy=ball.y-goal.y;
  if(Math.hypot(dx,dy)<goal.r){
    spawnParticles(ball.x,ball.y);
    setTimeout(()=>{level++;seed=Math.floor(Math.random()*1e9);setupLevel();},500);
  }

  // Update particles
  particles=particles.filter(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;return p.life>0;});
}

// Particles
function spawnParticles(x,y){
  for(let i=0;i<100;i++){
    const a=Math.random()*Math.PI*2;
    const s=200+Math.random()*150;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.4,color:'#FF7A00'});
  }
}

// Render
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#0E0F12';ctx.fillRect(0,0,canvas.width,canvas.height);

  // Maze walls
  ctx.strokeStyle='#1A1A1A';ctx.lineWidth=4;
  for(let y=0;y<rows;y++){
    for(let x=0;x<cols;x++){
      const c=maze[y][x];
      const bx=offsetX+x*cellSize,by=offsetY+y*cellSize;
      ctx.beginPath();
      if(c.walls.N){ctx.moveTo(bx,by);ctx.lineTo(bx+cellSize,by);}
      if(c.walls.S){ctx.moveTo(bx,by+cellSize);ctx.lineTo(bx+cellSize,by+cellSize);}
      if(c.walls.W){ctx.moveTo(bx,by);ctx.lineTo(bx,by+cellSize);}
      if(c.walls.E){ctx.moveTo(bx+cellSize,by);ctx.lineTo(bx+cellSize,by+cellSize);}
      ctx.stroke();
    }
  }

  // Goal
  ctx.beginPath();
  ctx.arc(goal.x,goal.y,goal.r,0,Math.PI*2);
  ctx.fillStyle='#000';ctx.fill();
  ctx.strokeStyle='#1A1A1A';ctx.stroke();

  // Ball glow
  const grad=ctx.createRadialGradient(ball.x,ball.y,ball.r*0.6,ball.x,ball.y,ball.r*2);
  grad.addColorStop(0,'#2FD0FF');grad.addColorStop(1,'rgba(47,208,255,0)');
  ctx.fillStyle=grad;
  ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r*2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#2FD0FF';
  ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();

  // Particles
  ctx.globalCompositeOperation='lighter';
  for(const p of particles){
    ctx.globalAlpha=p.life*2.5;
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
}

// Loop
let last=performance.now();
function loop(now){
  const dt=(now-last)/1000;last=now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
setupLevel();
loop(last);
</script>
</body>
